<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="TG App - Biblioteca de Trabalhos de Graduação da Faculdade de Tecnologia José Crespo Gonzales">

    <title>TG App | Trabalhos de Graduação</title>

    <!-- Fonte utilizada no projeto original -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS principal -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         CABEÇALHO
         ========================================================= -->

    <header class="header">

        <a href="index.html" class="logo-link" aria-label="Página inicial">
            <img src="assets/images/logoFatec.png" alt="Logo da Fatec" class="logo-fatec">
        </a>

        <div class="header-buttons">


            <a href="pages/cadastro.html" class="btn-header btn-admin" id="adminButton">
                Área administrativa
            </a>
            


        </div>

    </header>


    <!-- =========================================================
         IDENTIFICAÇÃO DA FACULDADE
         ========================================================= -->

    <div class="sub-header">
        Faculdade de Tecnologia José Crespo Gonzales
    </div>


    <!-- =========================================================
         ÁREA PRINCIPAL
         ========================================================= -->

    <main class="main-content">

        <!-- =====================================================
             PESQUISA
             ===================================================== -->

        <section class="search-container" id="searchArea">

            <h1 class="search-title">
                BUSCAR POR TRABALHOS DE GRADUAÇÃO
            </h1>

            <p class="sub-text">
                Pesquise por trabalhos, alunos ou orientadores
            </p>

            <form class="search-bar" id="searchForm">

                <label for="termo" class="sr-only">
                    Pesquisar trabalhos
                </label>

                <input type="search" id="termo" name="termo" placeholder="" autocomplete="off">

                <button type="submit" class="search-icon" id="searchButton" aria-label="Pesquisar">
                    <img src="assets/images/icon_lupa.png" alt="">
                </button>

            </form>

        </section>


        <!-- =====================================================
             ÁREA DE RESULTADOS
             ===================================================== -->

        <section class="results-section" id="resultsSection">

            <!-- Mensagem de resultados -->

            <div class="linha-mensagem" id="resultsMessage">

                <p class="mensagem-resultado" id="resultsCount">
                    <!-- Preenchido pelo JavaScript -->
                </p>

                <button type="button" class="link-filtrar" id="filterButton">
                    Filtrar
                </button>

            </div>


            <!-- =================================================
                 LISTA DE RESULTADOS
                 ================================================= -->

            <div class="resultados" id="resultsList">

                <!--
                    Os projetos serão inseridos aqui pelo JavaScript.

                    Exemplo de estrutura criada dinamicamente:

                    <article class="card-result">
                        ...
                    </article>
                -->

            </div>


            <!-- =================================================
                 ESTADO SEM RESULTADOS
                 ================================================= -->

            <div class="empty-state" id="emptyState">

                <p>Nenhum resultado encontrado.</p>

            </div>


            <!-- =================================================
                 PAGINAÇÃO
                 ================================================= -->

            <nav class="pagination" id="pagination" aria-label="Paginação dos resultados">

                <!-- Criada pelo JavaScript -->

            </nav>

        </section>

    </main>


    <!-- =========================================================
         MODAL DE FILTROS
         ========================================================= -->

    <div id="modal-filtro" class="modal-filtro-overlay" aria-hidden="true">

        <div class="modal-filtro-conteudo" role="dialog" aria-modal="true" aria-labelledby="filterTitle">

            <button type="button" class="modal-close" id="closeFilterButton" aria-label="Fechar filtros">
                ×
            </button>

            <h2 id="filterTitle">
                Filtrar resultados
            </h2>


            <!-- Ano e semestre -->

            <div class="campo-duplo">

                <div class="campo-item">

                    <label for="ano_conclusao">
                        Ano:
                    </label>

                    <select id="ano_conclusao">
                        <option value="">--</option>
                    </select>

                </div>


                <div class="campo-item">

                    <label for="semestre">
                        Semestre:
                    </label>

                    <select id="semestre">

                        <option value="">
                            --
                        </option>

                        <option value="1">
                            1
                        </option>

                        <option value="2">
                            2
                        </option>

                    </select>

                </div>

            </div>


            <!-- Curso -->

            <div class="filter-field">

                <label for="curso">
                    Curso:
                </label>

                <select id="curso">

                    <option value="">
                        --
                    </option>

                    <option value="Análise e Desenvolvimento de Sistemas">
                        Análise e Desenvolvimento de Sistemas
                    </option>

                    <option value="Polímeros">
                        Polímeros
                    </option>

                    <option value="Logística">
                        Logística
                    </option>

                    <option value="Gestão Empresarial">
                        Gestão Empresarial
                    </option>

                    <option value="Manufatura Avançada">
                        Manufatura Avançada
                    </option>

                    <option value="Projetos Mecânicos">
                        Projetos Mecânicos
                    </option>

                    <option value="Gestão da Qualidade">
                        Gestão da Qualidade
                    </option>

                    <option value="Mecatrônica Industrial">
                        Mecatrônica Industrial
                    </option>

                </select>

            </div>


            <!-- Tipo de trabalho -->

            <div class="filter-field">

                <label for="tipo_trabalho">
                    Tipo de Trabalho:
                </label>

                <select id="tipo_trabalho">

                    <option value="">
                        --
                    </option>

                    <option value="pi">
                        Projeto Integrador
                    </option>

                    <option value="tg">
                        TG
                    </option>

                    <option value="ic">
                        Iniciação Científica
                    </option>

                </select>

            </div>


            <!-- Limpar filtros -->

            <div class="limpar-container">

                <button type="button" class="btn-limpar" id="clearFiltersButton">
                    Limpar filtros
                </button>

            </div>


            <!-- Botões -->

            <div class="botoes-modal">

                <button type="button" id="applyFiltersButton">
                    Aplicar Filtro
                </button>

                <button type="button" class="btn-modal-cancelar" id="cancelFilterButton">
                    Cancelar
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         MODAL DE DETALHES DO TRABALHO
         
         Ainda não será utilizado na Parte 1.
         Deixamos a estrutura pronta para a próxima etapa.
         ========================================================= -->

    <div id="detailsModal" class="details-modal-overlay" aria-hidden="true">

        <div class="details-modal-content" role="dialog" aria-modal="true">

            <button type="button" class="modal-close" id="closeDetailsButton" aria-label="Fechar">
                ×
            </button>

            <div id="detailsContent">
                <!-- Conteúdo inserido pelo JavaScript -->
            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
